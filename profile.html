<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>StudentHub · Profile</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <header class="nav">
    <a class="brand" href="index.html"><span class="brand-mark">SH</span> StudentHub</a>
    <ul class="nav-links">
      <li><a href="index.html">Home</a></li>
      <li><a href="courses.html">Courses</a></li>
      <li><a href="assignments.html">Assignments</a></li>
      <li><a href="schedule.html">Schedule</a></li>
      <li><a href="grades.html">Grades</a></li>
      <li><a href="profile.html">Profile</a></li>
    </ul>
    <div class="nav-actions">
      <button class="icon-btn" id="theme-toggle" type="button" aria-label="Toggle theme">◐</button>
      <a class="avatar-chip" href="profile.html"><span class="avatar">MC</span><span>Wassim baabaa</span></a>
      <button class="menu-btn" type="button" aria-label="Open menu">☰</button>
    </div>
  </header>

  <main class="page">
    <div class="kicker">Account</div>
    <h1>Student profile</h1>
    <div class="profile-grid">
      <aside class="card profile-card">
        <div class="big-avatar">MC</div>
        <h2 id="profile-name">wassim baabaa</h2>
        <p class="meta" id="profile-id">STU-20418</p>
        <p class="meta">Computer Science, BSc · Year 3</p>
        <p class="meta">North Campus · enrolled Sep 2024</p>
        <div class="bar" style="margin-top:18px"><span id="credit-bar" style="width:70%;background:#4f46e5"></span></div>
        <p class="meta" id="credit-text"></p>
      </aside>
      <section class="panel">
        <h3>Contact details</h3>
        <p class="meta">Edits stay in this browser only.</p>
        <form id="profile-form">
          <div class="form-grid">
            <label>First name <input name="firstName" required /></label>
            <label>Last name <input name="lastName" required /></label>
            <label>Email <input name="email" type="email" required /></label>
            <label>Phone <input name="phone" /></label>
            <label>Advisor <input name="advisor" /></label>
            <label>Program <input value="Computer Science, BSc" disabled /></label>
          </div>
          <div class="btn-row">
            <button class="btn btn-primary" type="submit">Save profile</button>
            <p class="meta save-msg"></p>
          </div>
        </form>
      </section>
    </div>
  </main>

  <footer class="footer">StudentHub · profile</footer>
  <script src="js/data.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
